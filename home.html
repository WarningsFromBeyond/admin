<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warnings From Beyond — Admin</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <iframe
    id="kit-app"
    title="Warnings From Beyond administration"
    allow="clipboard-read; clipboard-write"
  ></iframe>
  <script>
    const kitOrigin = "https://a7iif9p9aioj7z-19123.proxy.runpod.net";
    const frame = document.querySelector("#kit-app");
    let savedPath = localStorage.getItem("wfb-admin-route") || "/";
    if (!savedPath.startsWith("/") || savedPath.startsWith("//")) savedPath = "/";
    const liveAdmin = new URL(kitOrigin + savedPath);
liveAdmin.searchParams.set("admin_build", "e63ab00c");
    frame.src = liveAdmin.toString();
    window.addEventListener("message", (event) => {
      if (event.origin !== kitOrigin || event.data?.type !== "wfb-admin-route") return;
      const path = String(event.data.path || "/");
      if (path.startsWith("/") && !path.startsWith("//")) localStorage.setItem("wfb-admin-route", path);
    });
  </script>
</body>
</html>
